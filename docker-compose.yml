services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hireflow
      MYSQL_USER: hireflow
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: hireflow
      DB_USERNAME: hireflow
      DB_PASSWORD: secret
      SANCTUM_STATEFUL_DOMAINS: localhost:8080,127.0.0.1:8080
      SESSION_DRIVER: database
      SESSION_DOMAIN: null
      SESSION_SECURE_COOKIE: "false"
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
    ports:
      - "8000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(file_get_contents('http://127.0.0.1/up')===false?1:0);\""]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_storage:/var/www/html/storage

  queue:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["php", "artisan", "queue:work", "--daemon", "--tries=3"]
    environment:
      APP_ENV: production
      APP_KEY: ""
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: hireflow
      DB_USERNAME: hireflow
      DB_PASSWORD: secret
      QUEUE_CONNECTION: database
    depends_on:
      - backend
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  db_data:
  backend_storage: